<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="362" viewBox="0 0 1050 362" role="img" aria-labelledby="title desc">
  <title id="title">Kashi icon design scale</title>
  <desc id="desc">Three panels show the 20 by 20 grid, a filled calendar with negative space, and the clearance around a file restore badge.</desc>
  <defs>
    <pattern id="unit-grid" width="1" height="1" patternUnits="userSpaceOnUse">
      <path d="M0 1V0h1" fill="none" stroke="#d8e4dc" stroke-width=".08"/>
    </pattern>
    <mask id="file-clearance" maskUnits="userSpaceOnUse" x="0" y="0" width="20" height="20">
      <rect width="20" height="20" fill="#fff"/>
      <circle cx="15" cy="15" r="4.6" fill="#000"/>
    </mask>
  </defs>
  <rect width="1050" height="362" fill="#eff4ef"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="30" y="32" fill="#246c5a" font-size="12" font-weight="700" letter-spacing="1.7">KASHI / ICON DESIGN SCALE</text>
    <text x="1020" y="32" fill="#4b665b" font-size="12" text-anchor="end">20-unit canvas · 1.5-unit reference stroke</text>
    <g fill="#fbfdfb" stroke="#d2dfd6">
      <rect x="30" y="52" width="320" height="280" rx="14"/>
      <rect x="365" y="52" width="320" height="280" rx="14"/>
      <rect x="700" y="52" width="320" height="280" rx="14"/>
    </g>
    <g fill="#163c33" font-size="17" font-weight="700">
      <text x="51" y="80">01  Grid and visual size</text>
      <text x="386" y="80">02  Filled negative space</text>
      <text x="721" y="80">03  Corner status badge</text>
    </g>
    <g fill="#4b665b" font-size="12">
      <text x="51" y="104">Round joins and caps keep the weight consistent.</text>
      <text x="386" y="104">Preserve the details that carry meaning.</text>
      <text x="721" y="104">Give the subject and the badge separate space.</text>
    </g>
    <g transform="translate(110 122) scale(8)" stroke-linecap="round" stroke-linejoin="round">
      <rect width="20" height="20" fill="url(#unit-grid)" stroke="#bacdc1" stroke-width=".12"/>
      <path d="M10 0v20M0 10h20" fill="none" stroke="#96b2a3" stroke-width=".12" stroke-dasharray=".38 .38"/>
      <rect x="2" y="2" width="16" height="16" rx=".45" fill="none" stroke="#6c9c89" stroke-width=".13" stroke-dasharray=".36 .29"/>
      <path d="M6.25 2.75h7.5c2.8 0 3.5.7 3.5 3.5v7.5c0 2.8-.7 3.5-3.5 3.5h-7.5c-2.8 0-3.5-.7-3.5-3.5v-7.5c0-2.8.7-3.5 3.5-3.5Z" fill="none" stroke="#216653" stroke-width="1.5"/>
    </g>
    <g transform="translate(445 122) scale(8)" stroke-linecap="round">
      <rect width="20" height="20" fill="url(#unit-grid)" stroke="#bacdc1" stroke-width=".12"/>
      <path d="M6.1 4.25h7.8c2.48 0 3.1.62 3.1 3.1v6.8c0 2.48-.62 3.1-3.1 3.1H6.1c-2.48 0-3.1-.62-3.1-3.1v-6.8c0-2.48.62-3.1 3.1-3.1ZM5.6 8h8.8a.7.7 0 1 1 0 1.4H5.6a.7.7 0 1 1 0-1.4Zm2.15 3.65a.75.75 0 1 1-1.5 0 .75.75 0 1 1 1.5 0Zm3 0a.75.75 0 1 1-1.5 0 .75.75 0 1 1 1.5 0Zm3 0a.75.75 0 1 1-1.5 0 .75.75 0 1 1 1.5 0Zm-6 2.6a.75.75 0 1 1-1.5 0 .75.75 0 1 1 1.5 0Zm3 0a.75.75 0 1 1-1.5 0 .75.75 0 1 1 1.5 0Z" fill="#216653" fill-rule="evenodd"/>
      <path d="M7 2.75v2.5m6-2.5v2.5" stroke="#216653" stroke-width="1.5"/>
    </g>
    <g transform="translate(780 122) scale(8)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect width="20" height="20" fill="url(#unit-grid)" stroke="#bacdc1" stroke-width=".12"/>
      <g stroke="#216653" stroke-width="1.5" mask="url(#file-clearance)">
        <path d="M3 13.4V5.75c0-1.6 1.05-2.65 2.65-2.65h3.3M5.35 14.8V7.55c0-1.4 1-2.3 2.3-2.3h3.85l3.25 3.25v6.3c0 1.4-.9 2.3-2.3 2.3h-4.8c-1.4 0-2.3-.9-2.3-2.3Zm6.15-9.35v1.5c0 .9.65 1.55 1.55 1.55h1.5M8 10.95h2.8m-2.8 2.75h1.7"/>
      </g>
      <circle cx="15" cy="15" r="4.6" stroke="#9870a8" stroke-width=".13" stroke-dasharray=".34 .27"/>
      <path d="M17.6 15a2.6 2.6 0 1 1-.8-1.85m.95-.75v1.4h-1.4" stroke="#71528a" stroke-width="1.5"/>
    </g>
    <g fill="#4b665b" font-size="12" text-anchor="middle">
      <text x="190" y="311">Dashed guide · 2 units of visible padding</text>
      <text x="525" y="311">Open slots and dots stay visible at 20 px</text>
      <text x="860" y="311">Center (15, 15) · clearance radius 4.6</text>
    </g>
  </g>
</svg>
