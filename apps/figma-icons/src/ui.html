<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>آیکون‌های کاشی</title>
<style>
/*KASHI_FONT*/
:root {
  --bg: var(--figma-color-bg, #ffffff);
  --panel: var(--figma-color-bg-secondary, #f6f7f9);
  --fg: var(--figma-color-text, #15171c);
  --muted: var(--figma-color-text-secondary, #687491);
  --faint: var(--figma-color-text-tertiary, #8792ab);
  --line: var(--figma-color-border, #e6e8ee);
  /* کاشی‌ها از رنگ متن و زمینه ساخته می‌شوند تا با هر پوستهٔ فیگما درست بمانند */
  --tile: color-mix(in srgb, var(--fg) 6%, var(--bg));
  --tile-hover: color-mix(in srgb, var(--fg) 11%, var(--bg));
  --brand: #0b8077;
  --brand-fg: #ffffff;
  --brand-soft: rgba(15, 168, 155, 0.12);
  --ring: rgba(15, 168, 155, 0.35);
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 8px 24px rgba(16, 24, 40, 0.08);
  --r: 12px;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  color-scheme: light;
}
html.figma-dark, html.dark {
  --bg: var(--figma-color-bg, #17191e);
  --panel: var(--figma-color-bg-secondary, #1f2228);
  --fg: var(--figma-color-text, #f1f3f6);
  --muted: var(--figma-color-text-secondary, #9aa3b8);
  --faint: var(--figma-color-text-tertiary, #6f7890);
  --line: var(--figma-color-border, #2c3038);
  --brand: #22c2b4;
  --brand-fg: #04201e;
  --brand-soft: rgba(34, 194, 180, 0.14);
  --ring: rgba(34, 194, 180, 0.4);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 12px/1.6 "Vazirmatn", Tahoma, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 8px; }
svg { display: block; }
.app { display: grid; grid-template-rows: auto auto 1fr auto; grid-template-columns: minmax(0, 1fr); height: 100vh; }
.app > * { min-width: 0; }

/* ---------- بالا ---------- */
.top { display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px; }
.logo { inline-size: 30px; block-size: 30px; border-radius: 9px; display: grid; place-items: center; background: linear-gradient(135deg, #0fa89b, #2740ed); color: #fff; flex: none; box-shadow: 0 4px 12px rgba(15, 168, 155, 0.3); }
.logo svg { inline-size: 18px; block-size: 18px; }
.brand b { font-size: 14px; font-weight: 800; display: block; line-height: 1.3; }
.brand span { font-size: 11px; color: var(--muted); }
.top-actions { margin-inline-start: auto; display: flex; gap: 4px; }
.ghost { inline-size: 30px; block-size: 30px; border-radius: 9px; display: grid; place-items: center; color: var(--muted); transition: background 0.15s, color 0.15s, transform 0.1s; }
.ghost:hover { background: var(--tile); color: var(--fg); }
.ghost:active { transform: scale(0.94); }
.ghost svg { inline-size: 18px; block-size: 18px; }

.search { position: relative; margin: 0 14px; }
.search input { inline-size: 100%; block-size: 38px; border-radius: 11px; border: 1px solid var(--line); background: var(--panel); padding: 0 38px 0 64px; outline: none; transition: border-color 0.15s, box-shadow 0.15s, background 0.15s; }
.search input::-webkit-search-cancel-button { display: none; }
.search input::placeholder { color: var(--faint); }
.search input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px var(--ring); background: var(--bg); }
.search .s-icon { z-index: 1; position: absolute; inset-inline-start: 12px; inset-block-start: 10px; color: var(--faint); pointer-events: none; }
.search .s-icon svg { inline-size: 18px; block-size: 18px; }
.search kbd { position: absolute; inset-inline-end: 10px; inset-block-start: 9px; font: 11px/20px ui-monospace, Menlo, monospace; padding: 0 7px; border-radius: 6px; border: 1px solid var(--line); color: var(--faint); background: var(--bg); }
.search .clear { position: absolute; inset-inline-end: 8px; inset-block-start: 7px; inline-size: 24px; block-size: 24px; border-radius: 7px; display: none; place-items: center; color: var(--muted); }
.search.has-q kbd { display: none; }
.search.has-q .clear { display: grid; }
.search .clear:hover { background: var(--tile); }

.styles { display: flex; gap: 6px; padding: 10px 14px 8px; overflow-x: auto; scrollbar-width: none; }
.styles::-webkit-scrollbar { display: none; }
.style { flex: none; display: flex; align-items: center; gap: 6px; block-size: 32px; padding: 0 11px 0 12px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.1s; white-space: nowrap; }
.style svg { inline-size: 18px; block-size: 18px; }
.style:hover { color: var(--fg); background: var(--tile); }
.style:active { transform: scale(0.96); }
.style[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }

/* ---------- میانه ---------- */
.main { display: grid; grid-template-columns: clamp(186px, 30%, 210px) minmax(0, 1fr); min-height: 0; border-top: 1px solid var(--line); }
.side { overflow-y: auto; padding: 8px 8px 16px; border-inline-end: 1px solid var(--line); scrollbar-width: thin; }
.side h4 { margin: 12px 8px 4px; font-size: 10.5px; font-weight: 700; color: var(--faint); letter-spacing: 0.2px; }
.cat { inline-size: 100%; display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 9px; color: var(--muted); text-align: start; transition: background 0.12s, color 0.12s; }
.cat svg { inline-size: 16px; block-size: 16px; flex: none; }
.cat span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat em { font-style: normal; font-size: 10px; color: var(--faint); flex: none; }
.cat:hover { background: var(--tile); color: var(--fg); }
.cat[aria-current="true"] { background: var(--brand-soft); color: var(--brand); font-weight: 700; }
.cat[aria-current="true"] em { color: var(--brand); }

.content { overflow-y: auto; padding: 4px 12px 16px; min-width: 0; scrollbar-width: thin; }
.content-head { position: sticky; top: 0; z-index: 2; background: var(--bg); display: flex; align-items: baseline; gap: 8px; padding: 10px 2px 8px; }
.content-head b { font-size: 13px; font-weight: 800; }
.content-head span { color: var(--faint); font-size: 11px; }
.content-head .hint { margin-inline-start: auto; font-size: 10.5px; color: var(--faint); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; }
.tile { position: relative; aspect-ratio: 1; border-radius: var(--r); background: var(--tile); display: grid; place-items: center; color: var(--fg); transition: background 0.15s, transform 0.15s var(--ease), box-shadow 0.15s; }
.tile svg { inline-size: 24px; block-size: 24px; pointer-events: none; }
.tile:hover { background: var(--tile-hover); transform: translateY(-1px); }
.tile:active { transform: scale(0.94); }
.tile[aria-selected="true"] { background: var(--brand-soft); color: var(--brand); box-shadow: inset 0 0 0 1.5px var(--brand); }
.tile .fav { position: absolute; inset-block-start: 4px; inset-inline-end: 4px; inline-size: 6px; block-size: 6px; border-radius: 50%; background: #f5b544; }
.tile.dragging { opacity: 0.5; }
.more { block-size: 1px; }
.empty { padding: 48px 12px; text-align: center; color: var(--muted); }
.empty svg { inline-size: 40px; block-size: 40px; margin: 0 auto 10px; color: var(--faint); }
.empty b { display: block; color: var(--fg); font-size: 13px; margin-bottom: 4px; }

/* ---------- بازرس پایین ---------- */
.inspector { border-top: 1px solid var(--line); background: var(--bg); padding: 12px 14px 14px; display: grid; gap: 10px; box-shadow: 0 -8px 24px rgba(16, 24, 40, 0.04); }
.ins-head { display: flex; align-items: center; gap: 12px; min-width: 0; }
.preview { inline-size: 56px; block-size: 56px; border-radius: 14px; flex: none; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); background-image: linear-gradient(45deg, var(--tile) 25%, transparent 25%, transparent 75%, var(--tile) 75%), linear-gradient(45deg, var(--tile) 25%, transparent 25%, transparent 75%, var(--tile) 75%); background-size: 10px 10px; background-position: 0 0, 5px 5px; }
.preview svg { inline-size: 32px; block-size: 32px; }
.preview.stack { position: relative; }
.preview.stack b { position: absolute; inset-block-end: -6px; inset-inline-start: -6px; min-inline-size: 22px; block-size: 22px; padding: 0 6px; border-radius: 11px; background: var(--brand); color: var(--brand-fg); font-size: 11px; display: grid; place-items: center; border: 2px solid var(--bg); }
.meta { min-width: 0; flex: 1; }
.meta b { display: block; font-size: 13.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta button.name { font: 11px/1.6 ui-monospace, Menlo, monospace; color: var(--muted); direction: ltr; padding: 0 6px; margin-inline-start: -6px; border-radius: 6px; max-inline-size: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.meta button.name.hint { font: 11px/1.6 "Vazirmatn", Tahoma, sans-serif; direction: rtl; }
.meta button.name:hover { background: var(--tile); color: var(--fg); }
.star { inline-size: 34px; block-size: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--faint); border: 1px solid var(--line); transition: color 0.15s, background 0.15s, transform 0.15s var(--ease); }
.star svg { inline-size: 18px; block-size: 18px; }
.star:hover { color: #f5b544; }
.star[aria-pressed="true"] { color: #f5b544; background: rgba(245, 181, 68, 0.12); border-color: rgba(245, 181, 68, 0.4); }
.star.pop { animation: pop 0.35s var(--ease); }
@keyframes pop { 40% { transform: scale(1.18); } }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.ctl { display: flex; align-items: center; gap: 6px; }
.ctl label { font-size: 11px; color: var(--muted); }
.swatches { display: flex; gap: 4px; }
.sw { inline-size: 20px; block-size: 20px; border-radius: 50%; border: 1px solid var(--line); box-shadow: inset 0 0 0 2px var(--bg); transition: transform 0.12s; }
.sw:hover { transform: scale(1.12); }
.sw[aria-pressed="true"] { outline: 2px solid var(--brand); outline-offset: 1px; }
.sw.pick { position: relative; overflow: hidden; background: conic-gradient(#e51d2a, #f98307, #ffd788, #518b25, #0fa89b, #2740ed, #8b5cf6, #e51d2a); }
.sw.pick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
.seg button { min-inline-size: 28px; block-size: 24px; padding: 0 6px; border-radius: 7px; font-size: 11px; color: var(--muted); transition: background 0.12s, color 0.12s; }
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--fg); font-weight: 700; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }
input[type="range"] { inline-size: 84px; accent-color: var(--brand); }
.ctl output { font-size: 11px; color: var(--muted); min-inline-size: 24px; }
.ctl.disabled { opacity: 0.4; pointer-events: none; }

.actions { display: flex; gap: 6px; }
.btn { block-size: 36px; padding: 0 14px; border-radius: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--bg); transition: background 0.15s, transform 0.1s, box-shadow 0.15s, opacity 0.15s; white-space: nowrap; }
.btn svg { inline-size: 16px; block-size: 16px; }
.btn:hover { background: var(--tile); }
.btn:active { transform: scale(0.97); }
.btn.primary { flex: 1; background: var(--brand); color: var(--brand-fg); border-color: transparent; box-shadow: 0 4px 14px var(--ring); }
.btn.primary:hover { filter: brightness(1.06); }
.btn[disabled] { opacity: 0.45; pointer-events: none; }
.menu-wrap { position: relative; }
.menu { position: absolute; inset-block-end: calc(100% + 6px); inset-inline-end: 0; min-inline-size: 168px; padding: 5px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); box-shadow: var(--shadow); display: none; z-index: 10; transform-origin: bottom left; }
.menu.open { display: block; animation: menuIn 0.16s var(--ease); }
@keyframes menuIn { from { opacity: 0; transform: translateY(4px) scale(0.98); } }
.menu button { inline-size: 100%; display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 8px; text-align: start; }
.menu button:hover { background: var(--tile); }
.menu button small { margin-inline-start: auto; color: var(--faint); font-size: 10.5px; direction: ltr; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }

.toast { position: fixed; inset-inline: 0; inset-block-end: 200px; margin: auto; inline-size: max-content; max-inline-size: 80%; padding: 8px 14px; border-radius: 10px; background: var(--fg); color: var(--bg); font-weight: 600; box-shadow: var(--shadow); opacity: 0; transform: translateY(6px); transition: opacity 0.18s, transform 0.18s var(--ease); pointer-events: none; z-index: 20; }
.toast.show { opacity: 1; transform: none; }

.standalone-note { display: none; }
body.web .only-figma { display: none !important; }
body:not(.web) .only-web { display: none !important; }
body.web .standalone-note { display: inline; }
body.web #dl-svg { flex: 1; background: var(--brand); color: var(--brand-fg); border-color: transparent; box-shadow: 0 4px 14px var(--ring); }
.brand bdi { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; }
.ins-empty .meta b { color: var(--muted); font-weight: 700; }
.ins-empty .preview svg { opacity: 0.35; }

@media (max-width: 420px) {
  .main { grid-template-columns: 1fr; }
  .side { display: none; }
  .btn { padding: 0 10px; gap: 4px; }
  .controls { gap: 8px 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 32 32"><path fill="currentColor" fill-rule="evenodd" d="M16 1 11.61 5.39H5.39v6.22L1 16l4.39 4.39v6.22h6.22L16 31l4.39-4.39h6.22v-6.22L31 16l-4.39-4.39V5.39h-6.22Z M16 8.8 13.89 10.91H10.91v2.98L8.8 16l2.11 2.11v2.98h2.98L16 23.2l2.11-2.11h2.98v-2.98L23.2 16l-2.11-2.11v-2.98h-2.98Z"/></svg></div>
      <div class="brand"><b>آیکون‌های کاشی</b><span id="total"></span></div>
      <div class="top-actions">
        <button class="ghost only-figma" id="size-toggle" title="اندازهٔ پنل" aria-label="تغییر اندازهٔ پنل"></button>
        <button class="ghost only-web" id="theme-toggle" title="روشن / تیره" aria-label="روشن یا تیره"></button>
      </div>
    </div>
    <div class="search" id="search-box">
      <span class="s-icon" data-icon="search"></span>
      <input id="q" type="search" placeholder="جست‌وجو در آیکون‌ها، فارسی یا انگلیسی" autocomplete="off" spellcheck="false" aria-label="جست‌وجو">
      <kbd>/</kbd>
      <button class="clear" id="clear" aria-label="پاک کردن جست‌وجو" data-icon="close"></button>
    </div>
    <div class="styles" id="styles" role="toolbar" aria-label="سبک آیکون"></div>
  </header>

  <div class="main">
    <nav class="side" id="side" aria-label="دسته‌ها"></nav>
    <section class="content" id="content">
      <div class="content-head"><b id="view-title"></b><span id="view-count"></span><span class="hint only-figma">برای افزودن دوبار بزنید یا بکشید روی بوم</span></div>
      <div class="grid" id="grid" role="listbox" aria-multiselectable="true" aria-label="آیکون‌ها"></div>
      <div class="more" id="more"></div>
    </section>
  </div>

  <footer class="inspector" id="inspector">
    <div class="ins-head">
      <div class="preview" id="preview"></div>
      <div class="meta"><b id="ins-title"></b><button class="name" id="ins-name" title="کپی نام"></button></div>
      <button class="star" id="star" aria-pressed="false" title="علاقه‌مندی" data-icon="star"></button>
    </div>
    <div class="controls">
      <div class="ctl"><label>رنگ</label><div class="swatches" id="swatches"></div></div>
      <div class="ctl"><label>اندازه</label><div class="seg" id="sizes"></div></div>
      <div class="ctl" id="stroke-ctl"><label>ضخامت</label><input type="range" id="stroke" min="1" max="2.5" step="0.25"><output id="stroke-out"></output></div>
    </div>
    <div class="actions">
      <button class="btn primary only-figma" id="insert"><span data-icon="plus"></span><span id="insert-label">افزودن به فیگما</span></button>
      <button class="btn" id="dl-svg" title="دانلود SVG"><span data-icon="download"></span>SVG</button>
      <div class="menu-wrap">
        <button class="btn" id="png-btn" aria-haspopup="menu"><span data-icon="image"></span>PNG</button>
        <div class="menu" id="png-menu" role="menu">
          <button data-scale="1">PNG ۱× <small id="px1"></small></button>
          <button data-scale="2">PNG ۲× <small id="px2"></small></button>
          <button data-scale="3">PNG ۳× <small id="px3"></small></button>
        </div>
      </div>
      <div class="menu-wrap">
        <button class="btn" id="copy-btn" aria-haspopup="menu"><span data-icon="copy"></span>کپی</button>
        <div class="menu" id="copy-menu" role="menu">
          <button data-copy="svg">کد SVG</button>
          <button data-copy="react">کد React <small>@kashi-ui/icons</small></button>
          <button data-copy="html">کد HTML <small>iconSvg</small></button>
          <hr>
          <button data-copy="name">نام آیکون</button>
        </div>
      </div>
    </div>
  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/*KASHI_DATA*/
/*KASHI_RENDER*/
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var fa = function (n) { return Number(n).toLocaleString("fa-IR"); };
  var inFigma = window.parent !== window;
  var STYLE_LABELS = { light: "خطی", bold: "توپر", bulk: "حجمی", "two-tone": "دورنگ", broken: "شکسته", curved: "منحنی" };
  var FILLED = { bold: true, bulk: true };
  var SIZES = [16, 20, 24, 32, 48];
  var COLORS = [["currentColor", "رنگ متن"], ["#15171c", "سیاه"], ["#ffffff", "سفید"], ["#0b8077", "فیروزه‌ای"], ["#2740ed", "لاجوردی"], ["#f98307", "زعفرانی"], ["#e51d2a", "اناری"]];

  // ---------- داده ----------
  var NAMES = [], BY = {}, CAT_COUNT = {};
  DATA.icons.forEach(function (row) {
    var icon = { n: row[0], t: row[1], c: DATA.cats[row[2]][0], k: row[3], b: row[4], comp: row[5] };
    NAMES.push(icon.n); BY[icon.n] = icon;
    CAT_COUNT[icon.c] = (CAT_COUNT[icon.c] || 0) + 1;
  });
  var CAT_LABEL = {}; DATA.cats.forEach(function (c) { CAT_LABEL[c[0]] = c[1]; });
  function fold(s) {
    return String(s || "").toLowerCase()
      .replace(/[يى]/g, "ی").replace(/ك/g, "ک").replace(/[ةۀ]/g, "ه").replace(/[آأإٱ]/g, "ا").replace(/ؤ/g, "و")
      .replace(/[ً-ٰٟ]/g, "")
      .replace(/[۰-۹]/g, function (d) { return "۰۱۲۳۴۵۶۷۸۹".indexOf(d); }).replace(/[٠-٩]/g, function (d) { return "٠١٢٣٤٥٦٧٨٩".indexOf(d); })
      .replace(/[\s‌‍ـ_\-.،,]/g, "");
  }
  var INDEX = null;
  function index() {
    if (!INDEX) INDEX = NAMES.map(function (n) { var i = BY[n]; return [n, fold(n + "|" + i.t + "|" + i.k + "|" + CAT_LABEL[i.c])]; });
    return INDEX;
  }

  // ---------- وضعیت ----------
  var state = { variant: "light", size: 24, sw: 1.5, color: "currentColor", cat: "all", favs: [], recent: [], theme: null, panel: "normal" };
  var q = "";
  var selected = [];
  var focus = null;
  var list = [];
  var shown = 0;
  var PAGE = 168;

  function save() {
    var s = { variant: state.variant, size: state.size, sw: state.sw, color: state.color, favs: state.favs, recent: state.recent, theme: state.theme, panel: state.panel };
    if (inFigma) parent.postMessage({ pluginMessage: { type: "save", state: s } }, "*");
    else try { localStorage.setItem("kashi-icons", JSON.stringify(s)); } catch (e) {}
  }

  // ---------- ساخت SVG ----------
  var uid = 0;
  function body(name, variant, sw) { return KashiRender.renderBody(BY[name].b, variant, { uid: "k" + (++uid), sw: sw }); }
  function uiSvg(name, px) {
    return '<svg viewBox="0 0 20 20" width="' + px + '" height="' + px + '" fill="none" stroke="currentColor" stroke-width="' + state.sw + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body(name, state.variant, state.sw) + "</svg>";

    if (m.type === "state") {
      if (m.state) Object.keys(m.state).forEach(function (k) { if (m.state[k] !== undefined && m.state[k] !== null) state[k] = m.state[k]; });
      boot();
    } else if (m.type === "inserted") {
      toast(m.count === 1 ? "به فیگما اضافه شد" : fa(m.count) + " آیکون به فیگما اضافه شد");
    }
  };

  var booted = false;
  function boot() {
    if (booted) return; booted = true;
    if (!inFigma) { document.body.classList.add("web"); try { var s = JSON.parse(localStorage.getItem("kashi-icons") || "null"); if (s) Object.keys(s).forEach(function (k) { state[k] = s[k]; }); } catch (e) {} }
    if (inFigma && state.panel !== "normal") parent.postMessage({ pluginMessage: { type: "resize", size: state.panel } }, "*");
    $("total").innerHTML = fa(NAMES.length) + " آیکون · ۶ سبک · <bdi dir=\"ltr\">v" + DATA.version + "</bdi>";
    fillIcons(); renderStyles(); renderSide(); renderControls(); applyTheme();
    $("size-toggle").innerHTML = chrome(state.panel === "wide" ? "minimize-diagonal" : "maximize-diagonal", 18);
    filter(); renderInspector();
  }
  if (inFigma) { parent.postMessage({ pluginMessage: { type: "ready" } }, "*"); setTimeout(boot, 800); }
  else boot();
})();
</script>
