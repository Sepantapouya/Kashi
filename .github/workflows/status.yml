name: Service status
on:
  push:
    branches: [main]
    paths:
      - scripts/status/**
      - .github/workflows/status.yml
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: service-status
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Read previous measurements
        run: |
          if git ls-remote --exit-code --heads origin status; then
            git fetch origin status
            git show origin/status:status.json > /tmp/status.json
          fi
      - name: Check public services
        run: node scripts/status/collect.mjs /tmp/status.json
      - name: Publish measurements
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir /tmp/kashi-status
          cp /tmp/status.json /tmp/kashi-status/status.json
          cd /tmp/kashi-status
          git init -b status
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status.json
          git commit -m 'Update service measurements'
          gh auth setup-git
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin status
