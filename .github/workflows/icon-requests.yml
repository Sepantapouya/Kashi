name: Icon requests review

# هر دو هفته (دوشنبه‌های هفته‌های زوج سال) یک issue با فهرست درخواست‌های باز آیکون باز می‌کند
# تا انتشار منظم آیکون‌ها فراموش نشود. با Run workflow هم دستی اجرا می‌شود.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            const start = Date.UTC(now.getUTCFullYear(), 0, 1);
            const week = Math.floor((now - start) / 6048e5);
            if (context.eventName === "schedule" && week % 2 === 1) return core.info("هفتهٔ فرد؛ این هفته بررسی نیست");

            const { owner, repo } = context.repo;
            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: "open", labels: "icon request", per_page: 100 });
            const date = now.toISOString().slice(0, 10);
            const list = open.length
              ? open.map((i) => `- [ ] #${i.number} ${i.title} (${i.reactions?.["+1"] ?? 0} 👍)`).join("\n")
              : "درخواست بازی نیست.";
            await github.rest.issues.create({
              owner, repo,
              title: `بررسی درخواست‌های آیکون · ${date}`,
              labels: ["icon review"],
              body: [
                `${open.length} درخواست باز. برای هر کدام: بپذیرید و طراحی کنید (طبق packages/icons/DESIGN.md)، یا با دلیل ببندید.`,
                "",
                list,
                "",
                "آیکون‌های پذیرفته‌شده با یک changeset در نسخهٔ بعدی @kashi-ui/icons منتشر می‌شوند.",
              ].join("\n"),
            });
