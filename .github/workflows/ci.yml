name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, contrast check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # آسیب‌پذیری شدید در وابستگی‌هایی که به کاربر می‌رسند جلوی ادغام را می‌گیرد
      - run: npm audit --omit=dev --audit-level=high
      # بیلد توکن‌ها شامل بررسی کنتراست WCAG است و در صورت رد شدن شکست می‌خورد
      - run: npm run build
      - run: node --test scripts/status/model.test.mjs
      - run: npm test
      # پلاگین فیگما در شبیه‌ساز اجرا می‌شود؛ plugin/ باید با src/ و توکن‌ها هم‌خوان باشد
      - name: Figma plugin
        run: |
          npm run figma:test
          git diff --exit-code apps/figma-plugin/plugin apps/docs/public/downloads || (echo "Figma plugin output is stale: run npm run figma:build" && exit 1)
      - name: Build docs site
        run: npm run build -w @kashi-ui/docs
      - name: Check package contents
        run: |
          for p in tokens persian bank-logos icons css react; do
            (cd packages/$p && npm pack --dry-run --json > /dev/null)
          done

  consumer:
    name: Install in a Next.js app (npm + shadcn)
    # کاشیِ همین کامیت را مثل یک کاربر در پروژهٔ Next.js نصب و بیلد می‌کند: scripts/consumer-test.mjs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:consumer
